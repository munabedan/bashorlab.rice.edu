name: Build, Release, and Deploy Astro Site

on:
  # Trigger the workflow every time you push to the `main` branch
  push:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Permissions required for both GitHub Pages and GitHub Releases
permissions:
  contents: write   # Required to create releases and attach files
  pages: write      # Required to deploy to GitHub Pages
  id-token: write   # Required for secure OIDC authentication with Pages

jobs:
  # --- JOB 1: BUILD THE ASTRO SITE ---
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v6

      # 1. Build specifically for GitHub Pages (Injecting BOTH site and base)
      - name: Build for GitHub Pages
        uses: withastro/action@v3
        with:
          node-version: 24
          build-cmd: npm run build -- --site https://munabedan.github.io --base /bashorlab.rice.edu/

      # 2. Build a clean version for your Release ZIP (No 'base' injection)
      - name: Install dependencies for Release build
        run: npm ci

      - name: Build clean production site for Release
        run: npm run build

      - name: Upload clean build for Release Job
        uses: actions/upload-artifact@v4
        with:
          name: clean-release-dist
          path: dist

  # --- JOB 2: DEPLOY TO GITHUB PAGES ---
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # --- JOB 3: CREATE THE GITHUB RELEASE ---
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Download the CLEAN 'dist' folder built in step 2
      - name: Download clean build artifact
        uses: actions/download-artifact@v4
        with:
          name: clean-release-dist
          path: ./dist

      # Zip the clean files directly
      - name: Zip release artifact
        run: |
          cd dist
          zip -r ../astro-build-${{ github.sha }}.zip .
          cd ..

      # Creates the release on GitHub
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: release-${{ github.sha }}
          name: Release ${{ github.sha }}
          draft: false
          prerelease: false
          files: astro-build-${{ github.sha }}.zip