name: Build, Release, and Deploy Astro Site

on:
  # Trigger the workflow every time you push to the `main` branch
  push:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Permissions required for both GitHub Pages and GitHub Releases
permissions:
  contents: write   # Required to create releases and attach files
  pages: write      # Required to deploy to GitHub Pages
  id-token: write   # Required for secure OIDC authentication with Pages

jobs:
  # --- JOB 1: BUILD THE ASTRO SITE ---
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v6

      # Uses the official Astro action to install dependencies and compile the site
      - name: Install, build, and upload your site
        uses: withastro/action@v6

  # --- JOB 2: DEPLOY TO GITHUB PAGES ---
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v6

  # --- JOB 3: CREATE THE GITHUB RELEASE ---
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (needed for git context/tagging)
        uses: actions/checkout@v6

      # Downloads the tarball created natively by withastro/action
      # The default artifact name for Pages deployments is "github-pages"
      - name: Download build artifact
        uses: actions/download-artifact@v6
        with:
          name: github-pages
          path: ./downloaded-artifact

      # withastro/action packages the 'dist' directory directly into 'artifact.tar'
      # We extract it, zip it up for standard use, and clean up.
      - name: Prepare and Zip release artifact
        run: |
          mkdir dist
          tar -xf ./downloaded-artifact/artifact.tar -C ./dist
          cd dist
          zip -r ../astro-build-${{ github.sha }}.zip .
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: release-${{ github.sha }}
          name: Release ${{ github.sha }}
          draft: false
          prerelease: false
          files: astro-build-${{ github.sha }}.zip