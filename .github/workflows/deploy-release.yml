name: Build, Release, and Deploy Astro Site

on:
  # Trigger the workflow every time you push to the `main` branch
  push:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Permissions required for both GitHub Pages and GitHub Releases
permissions:
  contents: write   # Required to create releases and attach files
  pages: write      # Required to deploy to GitHub Pages
  id-token: write   # Required for secure OIDC authentication with Pages

jobs:
  # --- JOB 1: BUILD THE ASTRO SITE ---
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm' # Adjust to pnpm if you are using pnpm

      - name: Install dependencies
        run: npm ci # Swap to 'pnpm install' if using pnpm

      - name: Build your site
        run: npm run build # Swap to 'pnpm run build' if using pnpm

      # Upload the compiled 'dist' folder so the next jobs can use it
      - name: Upload production build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # --- JOB 2: DEPLOY TO GITHUB PAGES ---
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # --- JOB 3: CREATE THE GITHUB RELEASE ---
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (needed for git context/tagging)
        uses: actions/checkout@v6

      # Download the 'dist' folder that was uploaded in the build job
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages # upload-pages-artifact names it this by default
          path: ./downloaded-artifact

      # Extract the tarball created by upload-pages-artifact, then re-zip it for your release asset
      - name: Prepare and Zip release artifact
        run: |
          mkdir dist
          tar -xf ./downloaded-artifact/artifact.tar -C ./dist
          cd dist
          zip -r ../astro-build-${{ github.sha }}.zip .
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: release-${{ github.sha }}
          name: Release ${{ github.sha }}
          draft: false
          prerelease: false
          files: astro-build-${{ github.sha }}.zip