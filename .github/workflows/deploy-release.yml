name: Build, Release, and Deploy Astro Site

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   
  pages: write      
  id-token: write   

jobs:
  # --- JOB 1: BUILD BOTH VERSIONS OF THE SITE ---
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 1. BUILD FOR GITHUB PAGES (Uses environment variables which Astro natively respects)
      - name: Build for GitHub Pages
        run: npx astro build
        env:
          run: npx astro build --site "https://munabedan.github.io" --base "/bashorlab.rice.edu"
          

      # Upload the modified build artifact specifically for the Pages deploy step
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # 2. BUILD CLEAN VERSION FOR YOUR RELEASE ZIP (Resets base to root '/')
      - name: Build clean production site for Release
        run: npx astro build

      - name: Upload clean build for Release Job
        uses: actions/upload-artifact@v7
        with:
          name: clean-release-dist
          path: dist

  # --- JOB 2: DEPLOY TO GITHUB PAGES ---
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # --- JOB 3: CREATE THE GITHUB RELEASE ---
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download clean build artifact
        uses: actions/download-artifact@v8
        with:
          name: clean-release-dist
          path: ./dist

      # Zip the clean files directly
      - name: Zip release artifact
        run: |
          cd dist
          zip -r ../astro-build-${{ github.sha }}.zip .
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: release-${{ github.sha }}
          name: Release ${{ github.sha }}
          draft: false
          prerelease: false
          files: astro-build-${{ github.sha }}.zip